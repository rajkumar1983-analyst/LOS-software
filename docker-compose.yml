services:

  api-gateway:
    image: api-gateway
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      CUSTOMER_SERVICE_URL: http://customerservice:8081
      LOAN_SERVICE_URL: http://loanservice:8082
      AGGREGATOR_SERVICE_URL: http://aggregatorservice:8085
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
    extra_hosts:
      - "keycloak.local:host-gateway"
    depends_on:
      - customerservice
      - loanservice
      - aggregatorservice

  customerservice:
    image: customerservice
    build:
      context: ./customerservice
    container_name: customerservice
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=N7_Banking;encrypt=False;TrustServerCertificate=True
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: Test@1234
      # Flyway owns the schema (see src/main/resources/db/migration); Hibernate must not touch it.
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
    extra_hosts:
      - "keycloak.local:host-gateway"
    depends_on:
      db-init:
        condition: service_completed_successfully

  loanservice:
    image: loanservice
    build:
      context: ./loanservice/loanservice
    container_name: loanservice
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SPRING_LOAN_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=lending;encrypt=False;TrustServerCertificate=True
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: Test@1234
      # Flyway owns the schema (see src/main/resources/db/migration); Hibernate must not touch it.
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      CUSTOMER_SERVICE_URL: http://customerservice:8081
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    extra_hosts:
      - "keycloak.local:host-gateway"
    depends_on:
      customerservice:
        condition: service_started
      kafka:
        condition: service_started
      db-init:
        condition: service_completed_successfully

  aggregatorservice:
    image: aggregatorservice
    build:
      context: ./aggregatorservice/aggregatorservice
    container_name: aggregatorservice
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CUSTOMER_SERVICE_URL: http://customerservice:8081
      LOAN_SERVICE_URL: http://loanservice:8082
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
    extra_hosts:
      - "keycloak.local:host-gateway"
    depends_on:
      - customerservice
      - loanservice

  los-frontend:
    image: los-frontend
    build:
      context: ./LOS
      args:
        VITE_CUSTOMER_SERVICE_URL: ${VITE_CUSTOMER_SERVICE_URL}
        VITE_LOAN_SERVICE_URL: ${VITE_LOAN_SERVICE_URL}
        VITE_AGGREGATOR_SERVICE_URL: ${VITE_AGGREGATOR_SERVICE_URL}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID}
    container_name: los-frontend
    ports:
      - "5173:80"
    depends_on:
      - aggregatorservice
      - customerservice
      - loanservice
  
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    ports:
      # Host SQL Server occupies 1433, so publish the container's on 14330 for tools.
      - "14330:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Str0ngSaPwd2026"
      MSSQL_PID: "Developer"
      # Reserve a stable slice so SQL Server doesn't starve/over-commit in the WSL VM.
      MSSQL_MEMORY_LIMIT_MB: "2048"
    volumes:
      - mssql_data:/var/opt/mssql

  # One-shot: waits for SQL Server, then creates the app login + databases.
  db-init:
    image: mcr.microsoft.com/mssql-tools
    container_name: db-init
    depends_on:
      - sqlserver
    environment:
      MSSQL_SA_PASSWORD: "Str0ngSaPwd2026"
    volumes:
      - ./db/init:/init:ro
    entrypoint: >
      /bin/bash -c "
      for i in {1..60}; do
        /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' && break;
        echo 'waiting for sqlserver...'; sleep 2;
      done;
      /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -i /init/01-init.sql"
    restart: "no"

  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two broker listeners: INTERNAL for containers (kafka:29092),
      # EXTERNAL for host clients (localhost:9092, published below).
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  auditservice:
    image: auditservice
    build:
      context: ./auditservice
    container_name: auditservice
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - kafka

  notificationservice:
    image: notificationservice
    build:
      context: ./notificationservice
    container_name: notificationservice
    ports:
      - "8087:8087"
    environment:
      SERVER_PORT: 8087
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - kafka

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: los-keycloak
    # --import-realm seeds los-realm (realm + client + roles + users) on a FRESH volume
    # (e.g. EC2). If the realm already exists (local), the import is skipped.
    command: start-dev --import-realm
    ports:
      - "9090:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Relative path: "/" in dev (direct on :9090), "/auth" on EC2 (behind nginx).
      KC_HTTP_RELATIVE_PATH: ${KC_HTTP_RELATIVE_PATH:-/}
      # Trust proxy forwarding headers so issuer/redirect URLs are correct behind nginx.
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
    # Mounts the EXISTING volume so the los-realm, clients and users are preserved.
    volumes:
      - keycloak_data:/opt/keycloak/data
      # Realm seed for fresh instances (read on startup by --import-realm).
      - ./keycloak/realm-export:/opt/keycloak/data/import:ro
    restart: unless-stopped
  
  nginx:
    build:
      context: ./nginx
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - los-frontend
      - api-gateway
      - keycloak

networks:
  default:
    name: banking-network

volumes:
  keycloak_data:
    # Use the existing (unprefixed) volume that already holds the los-realm, clients
    # and users. Not `external`, so a fresh EC2 host just creates an empty one (import
    # the realm there). Locally this reuses your real data.
    name: keycloak_data
  mssql_data:
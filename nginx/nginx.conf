events {}

http {

    server {
        listen 80;
        server_name _;

        # SPA frontend (its own container handles client-side route fallback).
        location / {
            proxy_pass http://los-frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API gateway: customers, loans, lookups, registration.
        location /api/ {
            proxy_pass http://api-gateway:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Aggregator dashboard (mapped through the gateway at /dashboard/**).
        location /dashboard/ {
            proxy_pass http://api-gateway:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Keycloak, served under /auth (KC_HTTP_RELATIVE_PATH=/auth).
        # X-Forwarded-* let Keycloak generate correct issuer/redirect URLs behind the proxy.
        location /auth/ {
            proxy_pass http://los-keycloak:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
        }
    }
}

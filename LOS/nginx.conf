server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: serve index.html for any client-side route (e.g. /register,
    # /banker, /applications/5) so deep links and refreshes don't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
